# Cloudflare Worker + D1 + SPA (dist/).
#
# API-host: api.gibby.it (Pages-frontend bv. op portaal.gibby.it → VITE_API_ORIGIN=https://api.gibby.it).
# Deploy: npm run deploy

name = "client-flow"
main = "worker/index.ts"
compatibility_date = "2024-11-01"

[[routes]]
pattern = "api.gibby.it"
zone_name = "gibby.it"
custom_domain = true

[vars]
# Alleen voor lokaal / eerste deploy; in productie: wrangler secret put JWT_SECRET
JWT_SECRET = "1495960008180958"
# Eerste account: registreren als `users` leeg is. Daarna alleen nieuwe accounts als dit "true" is:
# ALLOW_REGISTRATION = "false"
TELEGRAM_BOT_TOKEN = "8140190358:AAGAXPoNzjw5r5s5COnLwUOlqr8F5VE91Tc"
TELEGRAM_CHAT_ID = "700986250"

[[d1_databases]]
binding = "DB"
database_name = "client-flow"
database_id = "edfd0cb4-569d-42e7-a3ff-e44583881b67"
migrations_dir = "migrations"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[ai]
binding = "AI"

[triggers]
crons = ["0 8 * * *", "23 8 * * *", "23 9 * * *"]

# ---------------------------------------------------------------------------
# DEV-omgeving: aparte worker op dev-portaal.gibby.it met een EIGEN database.
# Serveert UI + API vanaf hetzelfde domein (VITE_API_ORIGIN blijft dus leeg).
# Deploy:        npm run deploy:dev
# Dev-DB vullen: npm run db:pull:dev   (kopie van productie)
# Bewust GEEN [triggers]/crons en GEEN Telegram → dev stuurt nooit echte meldingen.
# ---------------------------------------------------------------------------
[env.dev]
name = "client-flow-dev"

[[env.dev.routes]]
pattern = "dev-portaal.gibby.it"
zone_name = "gibby.it"
custom_domain = true

[env.dev.vars]
# Aparte JWT-secret: dev-sessies werken niet op productie en andersom.
JWT_SECRET = "dev-1495960008180958"
# Leeg: dev stuurt bewust GEEN Telegram-meldingen (worker guardt op lege waarde).
TELEGRAM_BOT_TOKEN = ""
TELEGRAM_CHAT_ID = ""

[[env.dev.d1_databases]]
binding = "DB"
database_name = "client-flow-dev"
database_id = "0f18a32a-7e53-4fb7-b33f-978369336326"
migrations_dir = "migrations"

[env.dev.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[env.dev.ai]
binding = "AI"
